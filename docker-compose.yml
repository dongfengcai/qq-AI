# ============================================================================
#  docker-compose.yml -- NapCat + AstrBot 编排
#
#  基于 NapNeko/NapCat-Docker 官方模板（compose/astrbot.yml）改了三处：
#
#   1. 内存上限。不加限制的话，任一容器泄漏会升级成整机 OOM，
#      把另一个容器一起带走。加了之后越界者自己重启，另一个继续服务。
#      memswap 也设了上限：如果它开始大量换页，说明出了问题，
#      重启比持续抖动更健康。
#
#   2. 端口只绑回环。所有对外端口都绑在 127.0.0.1，
#      所以即使云安全组配错了，面板也不会暴露在公网。
#      访问方式：SSH 隧道（见 README）。
#
#   3. 时区可配置，默认 Asia/Shanghai。让日志时间与 DeepSeek 的
#      峰谷价时段（北京时间 9-12 点、14-18 点为高峰）对齐。
#
#  用法：
#      docker compose up -d
#      docker compose logs -f
#      docker compose down
#
#  注意：变量来自同目录的 .env（由 deploy.sh 生成，或从 .env.example 复制）。
# ============================================================================

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - MODE=astrbot          # 预置好指向 AstrBot 的反向 WebSocket
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      # 只绑回环 —— 通过 ssh -L 6099:127.0.0.1:6099 访问
      - "127.0.0.1:6099:6099"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./ntqq:/app/.config/QQ
    networks:
      - qqbot
    # 硬上限。NapCat 带着完整的 QQ NT 客户端（Electron），所以占大头。
    mem_limit: 900m
    memswap_limit: 1500m
    # 别让一波消息把 2 核机器全占满。
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: unless-stopped
    depends_on:
      - napcat
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      # 只绑回环 —— 通过 ssh -L 6185:127.0.0.1:6185 访问
      - "127.0.0.1:6185:6185"
    volumes:
      - ./data:/AstrBot/data
    networks:
      - qqbot
    mem_limit: 900m
    memswap_limit: 1500m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  qqbot:
    driver: bridge

# ============================================================================
#  关于反向 WebSocket 端口 6199
#
#  它**故意没有发布**。NapCat 以 MODE=astrbot 运行，通过这个 compose 网络
#  连到 `astrbot` 服务，所以 OneBot 连接根本不出网桥。
#  发布 6199 等于把一个无认证的控制通道暴露到公网。
#
#  关于总量
#
#  900 + 900 = 1800MB 上限，而机器只有 2GB，加宿主机自身约 200-400MB。
#  这个"超卖"是有意的，也是安全的：这些是**上限而非预留**，
#  峰值时的差额由 swap 吸收（deploy.sh 会自动创建）。
#  实际占用用 `docker stats` 看。
# ============================================================================
