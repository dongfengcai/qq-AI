# ============================================================================
#  docker-compose.yml -- NapCat + AstrBot for the QQ chatbot
#
#  Based on the official template shipped by NapNeko/NapCat-Docker
#  (compose/astrbot.yml) with three deliberate changes for this server:
#
#   1. MEMORY LIMITS. The host has 2 GB. Without limits a leak in either
#      container escalates into a host-wide OOM kill and takes the other
#      container down with it. With limits, the offending container dies and
#      restarts (restart: always) while the other keeps serving.
#
#   2. LOOPBACK-ONLY PORTS. Every published port is bound to 127.0.0.1, so the
#      dashboards are unreachable from the internet even if the cloud security
#      group is misconfigured. Reach them over an SSH tunnel -- see README.
#
#   3. ASIA/SHANGHAI TIMEZONE on both, so logs and any scheduled work line up
#      with DeepSeek's peak/off-peak pricing windows.
#
#  Usage:  docker compose up -d
#          docker compose logs -f
#          docker compose down
# ============================================================================

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - MODE=astrbot          # pre-configures the reverse-WS link to AstrBot
      - TZ=Asia/Shanghai
    ports:
      # Bound to loopback only -- reach it via: ssh -L 6099:127.0.0.1:6099
      - "127.0.0.1:6099:6099"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./ntqq:/app/.config/QQ
    networks:
      - qqbot
    # Hard ceiling. NapCat carries a full QQ NT client (Electron), so it needs
    # the larger share. memswap is capped too: if it starts swapping heavily,
    # something is wrong and a restart is healthier than thrashing.
    mem_limit: 900m
    memswap_limit: 1500m
    # Do not let a burst of messages pin every core on a 2-core box.
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: unless-stopped
    depends_on:
      - napcat
    environment:
      - TZ=Asia/Shanghai
    ports:
      # Bound to loopback only -- reach it via: ssh -L 6185:127.0.0.1:6185
      - "127.0.0.1:6185:6185"
    volumes:
      - ./data:/AstrBot/data
    networks:
      - qqbot
    mem_limit: 900m
    memswap_limit: 1500m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  qqbot:
    driver: bridge

# NOTE ON THE REVERSE WEBSOCKET PORT (6199)
#   It is intentionally NOT published. NapCat runs with MODE=astrbot, which
#   points it at the `astrbot` service over this compose network, so the
#   OneBot connection never leaves the bridge. Publishing 6199 would expose an
#   unauthenticated control channel to the internet.
#
# NOTE ON TOTALS
#   900 + 900 = 1800 MB of limits against 2 GB of RAM, plus ~200-400 MB for
#   the host itself. The overcommit is deliberate and safe: these are ceilings,
#   not reservations, and the swap file from 02-setup-swap.sh absorbs the
#   difference during spikes. Check real usage with `docker stats`.
